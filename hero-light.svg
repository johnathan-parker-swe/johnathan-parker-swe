translate(671,45) rotate(0)" padding="6px" fill="#db2777">Offline</text><text font-size="44" font-weight="normal" transform="translate(859,80) rotate(0)" padding="6px" fill="#db2777">Real-time</text><text font-size="33" font-weight="normal" transform="translate(197,221) rotate(0)" padding="6px" fill="#2563eb">MQTT</text><text font-size="33" font-weight="normal" transform="translate(139,277) rotate(0)" padding="6px" fill="#64748b">RabbitMQ</text><text font-size="33" font-weight="normal" transform="translate(346,223) rotate(0)" padding="6px" fill="#0e7490">Redis</text><text font-size="33" font-weight="normal" transform="translate(281,418) rotate(0)" padding="6px" fill="#db2777">SQLite</text><text font-size="33" font-weight="normal" transform="translate(648,199) rotate(0)" padding="6px" fill="#db2777">Yjs</text><text font-size="33" font-weight="normal" transform="translate(142,180) rotate(0)" padding="6px" fill="#64748b">OAuth</text><text font-size="33" font-weight="normal" transform="translate(444,32) rotate(0)" padding="6px" fill="#7c3aed">TimescaleDB</text></g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#1f2328">
<text x="60" y="92">Hi there,</text>
<text x="60" y="132">I&#39;ve spent 13+ years building web, mobile and cloud applications, and the part I enjoy most is the whole arc: the </text>
<text x="60" y="158">first rough prototype, the long middle, and the day it runs in production without anyone thinking about it.</text>
<text x="60" y="198">On the web, I built <tspan font-weight="700">Staybook</tspan> so vacation-rental hosts could take bookings directly, with live availability, an </text>
<text x="60" y="224">itemized price breakdown and Stripe checkout. Then <tspan font-weight="700">Huddle</tspan>, a whiteboard where a whole product team can sketch </text>
<text x="60" y="250">together and every cursor stays in sync.</text>
<text x="60" y="290">On mobile, <tspan font-weight="700">ClearPass</tspan> walks new customers through ID capture and a selfie match in React Native, and <tspan font-weight="700">FieldKit</tspan> gives </text>
<text x="60" y="316">field technicians an app that keeps working with no signal and sorts out conflicting edits once it&#39;s back.</text>
<text x="60" y="356">Behind the scenes, <tspan font-weight="700">FleetPulse</tspan> watches temperature sensors across refrigerated trucks and warehouses and speaks up </text>
<text x="60" y="382">before anything spoils, and <tspan font-weight="700">LedgerSync</tspan> keeps invoices and payments matched between commerce and accounting systems, </text>
<text x="60" y="408">retrying quietly when an API has a bad day.</text>
<text x="60" y="448">Different products, same habits: typed APIs, retries and monitoring built in, and releases on AWS or Azure that </text>
<text x="60" y="474">ship safely.</text>
<text x="940" y="520" text-anchor="end" font-style="italic" font-weight="700" font-size="17">— Johnathan Parker</text>
<text x="940" y="542" text-anchor="end" font-size="13" fill="#59636e">senior software engineer · web, mobile and cloud</text>
</g></svg>